<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desbloquea tu regalo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p { margin-bottom: 40px; font-size: 1.2em; max-width: 600px; }
        #counter {
            font-size: 4em;
            font-weight: bold;
            margin-bottom: 30px;
            color: #f1c40f;
        }
        #btn {
            padding: 20px 40px;
            font-size: 2em;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        #btn:active { transform: scale(0.95); }
        #secret {
            display: none;
            background-color: #27ae60;
            padding: 30px;
            border-radius: 10px;
            font-size: 2em;
        }
    </style>
</head>
<body>

    <div id="game">
        <h1>El Reto Final</h1>
        <p>Para revelar la clave secreta, debes hacer clic en el botón 100.000 veces. <br><br><strong>Reglas:</strong> Si usas trampas o dejas de hacer clic durante más de 10 segundos, el contador volverá a cero.</p>
        
        <div id="counter">0</div>
        <button id="btn">¡CLIC!</button>
    </div>

    <div id="secret">
        ¡Enhorabuena! La clave es: <strong>8472</strong> <!-- Cambia tu clave aquí -->
    </div>

    <script>
        const targetClicks = 10;
        let count = 0;
        let lastClickTime = 0;
        let timeoutId;
        
        const counterEl = document.getElementById('counter');
        const btn = document.getElementById('btn');
        const secretEl = document.getElementById('secret');
        const gameEl = document.getElementById('game');

        // Función para generar un sonido de burla (trompeta triste / wah-wah)
        function playMockSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.type = 'sawtooth';
            // Tono descendente
            osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 1);
            
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
            
            osc.start();
            osc.stop(ctx.currentTime + 1);
        }

        function resetGame(reason) {
            count = 0;
            counterEl.textContent = count;
            playMockSound();
            alert("¡Meeec! " + reason + " Vuelta a empezar.");
        }

        btn.addEventListener('click', function(e) {
            const now = Date.now();

            // 1. Detectar autoclickers mediante e.isTrusted (evita scripts que simulan clics)
            if (!e.isTrusted) {
                clearTimeout(timeoutId);
                resetGame("Eso ha sido un clic falso.");
                return;
            }

            // 2. Detectar autoclickers por velocidad inhumana (menos de 30ms entre clics)
            if (lastClickTime !== 0 && (now - lastClickTime) < 30) {
                clearTimeout(timeoutId);
                resetGame("¡Vas demasiado rápido! ¿Usando un Autoclicker?");
                return;
            }
            
            lastClickTime = now;
            count++;
            counterEl.textContent = count;

            // Condición de victoria
            if (count >= targetClicks) {
                clearTimeout(timeoutId);
                gameEl.style.display = 'none';
                secretEl.style.display = 'block';
                return;
            }

            // 3. Reiniciar si pasan más de 10 segundos (10000 milisegundos)
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                resetGame("Te has dormido. Han pasado más de 10 segundos.");
            }, 10000);
        });
    </script>
</body>
</html>
