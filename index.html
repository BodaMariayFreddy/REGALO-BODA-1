<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Reto de los 241.026 Clics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p { margin-bottom: 30px; font-size: 1.2em; max-width: 600px; padding: 0 20px; }
        
        #login-screen, #game-screen, #secret-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        
        /* La pantalla de login es la que se ve primero */
        #login-screen.active, #game-screen.active, #secret-screen.active {
            display: flex;
        }

        input {
            padding: 10px;
            margin: 10px;
            font-size: 1.2em;
            border-radius: 5px;
            border: none;
            text-align: center;
            text-transform: uppercase; /* Ayuda visual para el usuario */
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.5em;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            margin-top: 20px;
        }
        button:active { transform: scale(0.95); }
        
        #counter {
            font-size: 4em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #f1c40f;
        }

        /* Estilos del modal (sustituto del alert) */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #34495e;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            text-align: center;
        }
        .modal-content button {
            background-color: #3498db;
            font-size: 1.2em;
            padding: 10px 20px;
        }

        #secret-screen {
            background-color: #27ae60;
            padding: 40px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="active">
        <h1>Acceso al Reto</h1>
        <p>Introduce las credenciales para continuar.</p>
        <input type="text" id="username" placeholder="Usuario" autocomplete="off">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
    </div>

    <!-- PANTALLA DEL JUEGO -->
    <div id="game-screen">
        <h1>El Reto Final: 24/10/26</h1>
        <p><strong>Reglas:</strong> Nada de trampas. Si detectamos un Autoclicker, tu contador volverá a CERO.</p>
        <div id="counter">0</div>
        <button id="btn">¡CLIC!</button>
    </div>

    <!-- PANTALLA SECRETA -->
    <div id="secret-screen">
        <h1>¡Prueba superada!</h1>
        <p>Habéis conseguido llegar a los 241.026 clics.</p>
        <h2>Vuestro código secreto es: 8472</h2>
    </div>

    <!-- MODAL ANTITRAMPAS -->
    <div id="modal">
        <div class="modal-content">
            <h2 id="modal-title">¡Aviso!</h2>
            <p id="modal-text"></p>
            <button onclick="closeModal()">Entendido</button>
        </div>
    </div>

    <script>
        // Configuración principal
        const TARGET_CLICKS = 241026;
        let count = parseInt(localStorage.getItem('bodaClicks')) || 0;
        let lastClickTime = 0;

        // Referencias al DOM
        const loginScreen = document.getElementById('login-screen');
        const gameScreen = document.getElementById('game-screen');
        const secretScreen = document.getElementById('secret-screen');
        const counterEl = document.getElementById('counter');
        const btn = document.getElementById('btn');
        const modal = document.getElementById('modal');
        const modalText = document.getElementById('modal-text');

        // Función de inicio de sesión
        function login() {
            const user = document.getElementById('username').value.trim().toUpperCase();
            const pass = document.getElementById('password').value.trim();

            if (user === 'BODAMARIAYFREDDY' && pass === '2026') {
                loginScreen.classList.remove('active');
                // Actualiza el texto con separador de miles antes de mostrar
                counterEl.textContent = count.toLocaleString('es-ES'); 
                checkWin(); // Comprueba si ya habían llegado a la meta antes
            } else {
                showModal("Credenciales incorrectas. Intentadlo de nuevo.");
            }
        }

        // Sistema antitrampas: Sonido
        function playMockSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 1);
            
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
            
            osc.start();
            osc.stop(ctx.currentTime + 1);
        }

        // Control del Modal
        function showModal(text) {
            modalText.textContent = text;
            modal.style.display = 'flex';
        }
        function closeModal() {
            modal.style.display = 'none';
        }

        // Sistema antitrampas: Castigo
        function resetCheater(reason) {
            playMockSound();
            showModal("¡Meeec! " + reason + " Vuelta a cero por tramposos.");
            count = 0;
            updateCounter();
        }

        // Guardado de clics
        function updateCounter() {
            counterEl.textContent = count.toLocaleString('es-ES');
            localStorage.setItem('bodaClicks', count);
        }

        // Comprobación de victoria
        function checkWin() {
            if (count >= TARGET_CLICKS) {
                gameScreen.classList.remove('active');
                secretScreen.classList.add('active');
            } else {
                gameScreen.classList.add('active');
            }
        }

        // Evento principal del botón
        btn.addEventListener('click', function(e) {
            const now = Date.now();

            // 1. Detectar autoclickers de software (simulados)
            if (!e.isTrusted) {
                resetCheater("Eso ha sido un clic falso.");
                return;
            }

            // 2. Detectar velocidad inhumana (menos de 30ms)
            if (lastClickTime !== 0 && (now - lastClickTime) < 30) {
                resetCheater("¡Vais demasiado rápido! ¿Usando un Autoclicker?");
                return;
            }
            
            lastClickTime = now;
            count++;
            updateCounter();
            
            if (count >= TARGET_CLICKS) {
                checkWin();
            }
        });
    </script>
</body>
</html>
